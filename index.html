<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Góc Game Học Tập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/hub.css">
</head>
<body>
  <header class="hub-header">
    <img class="hub-hero" src="games/key-jump/img/hero_jump.webp" alt="">
    <h1>Góc Game Học Tập</h1>
    <p>Chọn một trò chơi để bắt đầu nhé!</p>
  </header>

  <main class="game-grid">
    <a class="game-card featured" href="games/key-jump/index.html">
      <div class="card-art">
        <img src="games/key-jump/img/hero.webp" alt="">
        <img src="games/key-jump/img/monster_slime.webp" alt="">
      </div>
      <h2>Nhảy Qua Quái Vật</h2>
      <p>Luyện gõ phím: gõ đúng chữ quái vật giơ lên để nhảy qua và nhặt vàng!</p>
      <span class="badge">⌨️ Gõ phím · 15 màn</span>
    </a>

    <div class="game-card soon">
      <div class="game-icon">🔢</div>
      <h2>Sắp ra mắt</h2>
      <p>Trò chơi tiếp theo đang được làm...</p>
    </div>

    <div class="game-card soon">
      <div class="game-icon">🔤</div>
      <h2>Sắp ra mắt</h2>
      <p>Trò chơi tiếp theo đang được làm...</p>
    </div>
  </main>
</body>
</html>
